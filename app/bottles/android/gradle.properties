# Flutter 模板默认给的是 -Xmx8G -XX:MaxMetaspaceSize=4G，对本项目是严重过度配置，
# 而且在这台机器上会直接把构建打死：
#   物理内存 31.8G（可用 13.4G）看着很充裕，但 Windows 的「提交上限」只有 35.7G、
#   仅剩 3.2G 可提交——页面文件设得太小。JVM 要一次性提交 8G+4G 的虚拟地址空间，
#   于是 mmap 失败，daemon 崩溃：
#     Native memory allocation (mmap) failed to map ... bytes for G1 virtual space
#
# 2G 堆足够编译这个项目。想彻底解决，把系统页面文件调大（需重启）即可放宽这里。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin 编译在 Gradle 进程内跑，不再另起一个 JVM daemon——同样是为了省提交量。
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 关闭 Kotlin 增量编译。
#
# 本项目在 E 盘，而 pub cache（插件的 Kotlin 源码）在 C 盘。Kotlin 增量编译器要算
# 源文件相对模块根目录的相对路径，跨盘符算不出来，直接抛：
#   IllegalArgumentException: this and base files have different roots
#   AssertionError: Could not close incremental caches
# 这是 Windows 上 pub cache 与项目不同盘时的已知问题。
#
# 代价很小：插件的 Kotlin 代码量很少，全量编译也就多几秒；
# 我们自己的业务代码是 Dart，走的是另一条编译链路，完全不受影响。
#
# 想恢复增量编译的话，把 pub cache 挪到与项目同一个盘（设 PUB_CACHE 环境变量）即可。
kotlin.incremental=false
